<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Matrícula</title>
    <style>
        /* Estilos Globais e Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #faf6f0; /* Tom de fundo suave */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container do Formulário */
        .form-container {
            background-color: #faf6f0;
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        /* Cabeçalho */
        h1 {
            color: #5c1d1d; /* Vinho escuro */
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7c7c7c;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Estrutura das Linhas e Grupos */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        /* Etiquetas (Labels) */
        label {
            color: #333333;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        /* Campos de Entrada (Inputs e Selects) */
        input[type="text"],
        input[type="date"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcd1c4;
            border-radius: 4px;
            background-color: #ffffff;
            color: #333333;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #a0a0a0;
        }

        input:focus, select:focus {
            border-color: #5c1d1d;
        }

        /* Ajuste específico para o campo de data e seletores */
        input[type="date"] {
            color: #a0a0a0;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23a0a0a0' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 18px;
        }

        /* Botão de Submissão */
        .btn-submit {
            width: 100%;
            background-color: #5c1d1d;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #441414;
        }

        /* Rodapé Informativo */
        .footer-text {
            text-align: center;
            color: #9e9589;
            font-size: 11px;
            margin-top: 15px;
        }

        /* Responsividade para telas menores (Telemóveis) */
        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Formulário de matrícula</h1>
        <p class="subtitle">O pedido é registado no ecrã e entregue à secretaria para confirmação.</p>

        <form action="#" method="POST">
            
            <!-- Nome Completo -->
            <div class="form-group">
                <label for="nome">Nome completo do aluno</label>
                <input type="text" id="nome" name="nome" placeholder="Ex.: Maria dos Santos" required>
            </div>

            <!-- Data de Nascimento e Telefone -->
            <div class="form-row">
                <div class="form-group">
                    <label for="nascimento">Data de nascimento</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" placeholder="9XX XXX XXX" required>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email (opcional)</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com">
            </div>

            <!-- Classe e Curso -->
            <div class="form-row">
                <div class="form-group">
                    <label for="classe">Classe pretendida</label>
                    <select id="classe" name="classe" required>
                        <option value="" disabled selected>Escolher</option>
                        <!-- Adicione as opções aqui -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="curso">Curso</label>
                    <select id="curso" name="curso" required>
                        <option value="" disabled selected>Escolher</option>
                        <!-- Adicione as opções aqui -->
                    </select>
                </div>
            </div>

            <!-- Tipo de Matrícula -->
            <div class="form-group">
                <label for="tipo_matricula">Tipo de matrícula</label>
                <select id="tipo_matricula" name="tipo_matricula" required>
                    <option value="" disabled selected>Escolher</option>
                    <!-- Adicione as opções aqui -->
                </select>
            </div>

            <!-- Encarregado de Educação -->
            <div class="form-group">
                <label for="encarregado">Nome do encarregado de educação</label>
                <input type="text" id="encarregado" name="encarregado" placeholder="Ex.: João dos Santos" required>
            </div>

            <!-- Botão Enviar -->
            <button type="submit" class="btn-submit">Enviar pedido de matrícula</button>

            <!-- Nota de Rodapé -->
            <p class="footer-text">Os dados são usados apenas para o contacto da secretaria.</p>
        </form>
    </div>

</body>
</html>
